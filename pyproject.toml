[project]
name = "voice-input"
version = "0.2.0"
description = "Offline voice typing for the Linux desktop: press a shortcut, speak, and the text appears in the focused field."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Voice Input contributors" }]
keywords = ["speech-to-text", "dictation", "whisper", "voice-typing", "wayland", "linux", "offline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Desktop Environment",
]
dependencies = [
    "faster-whisper>=1.2.1",
    "numpy>=2.0",
    "python-xlib>=0.33",
    "sounddevice>=0.5.1",
]

[project.urls]
Homepage = "https://github.com/kursluzz/voice-input"
Repository = "https://github.com/kursluzz/voice-input"
Issues = "https://github.com/kursluzz/voice-input/issues"
Changelog = "https://github.com/kursluzz/voice-input/blob/main/CHANGELOG.md"

[project.scripts]
voice-input = "voice_input.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bump-my-version>=1.8.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.17.5",
]

[tool.bumpversion]
# Run `uv run bump-my-version bump patch|minor|major` on a clean main branch. It edits the files
# below, refreshes uv.lock, commits and creates the tag v<version>. Nothing is pushed.
current_version = "0.2.0"
commit = true
tag = true
tag_name = "v{new_version}"
tag_message = "Release {new_version}"
pre_commit_hooks = ["uv lock", "git add uv.lock"]

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "README.md"
search = "Version {current_version}"
replace = "Version {new_version}"

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = "## [Unreleased]\n\n## [{new_version}] - {now:%Y-%m-%d}"

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "[Unreleased]: https://github.com/kursluzz/voice-input/compare/v{current_version}...HEAD"
replace = """[Unreleased]: https://github.com/kursluzz/voice-input/compare/v{new_version}...HEAD
[{new_version}]: https://github.com/kursluzz/voice-input/compare/v{current_version}...v{new_version}"""

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "N",    # pep8-naming
    "RUF",  # ruff-specific
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["Xlib", "Xlib.*", "faster_whisper", "faster_whisper.*", "sounddevice", "ctranslate2", "huggingface_hub", "huggingface_hub.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "model: needs a downloaded Whisper model and real speech samples (skipped unless VOICE_INPUT_TEST_MODELS=1)",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["voice_input"]
branch = true
