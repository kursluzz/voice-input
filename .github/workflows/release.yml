name: Release

# Runs only when a version tag such as v0.1.0 is pushed. Create tags with bump-my-version.
# It creates the GitHub Release with the wheel and the sdist attached.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  checks:
    name: Run the CI checks on the tagged commit
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and check the tag
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.13"
      - name: The tag must match the package version
        run: |
          version="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version}" >&2
            exit 1
          fi
      - run: uv build
      - run: uvx --from twine==7.0.0 twine check --strict dist/*
      - run: uvx --from dist/*.whl voice-input --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github-release:
    name: Create the GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Release notes from the changelog, and the install command
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "No changelog section for ${version}" >&2; exit 1; }
          {
            printf '\n## Install\n\n'
            printf '```bash\n'
            printf 'uv tool install "voice-input @ https://github.com/%s/releases/download/%s/voice_input-%s-py3-none-any.whl"\n' "$GITHUB_REPOSITORY" "$TAG" "$version"
            printf 'voice-input setup all\n'
            printf '```\n'
          } >> release-notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file release-notes.md
